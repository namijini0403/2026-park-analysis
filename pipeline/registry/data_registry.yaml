# - sealed: true는 표 A에서 ⚠️봉인 표시가 된 파일. 봉인값은 CONTEXT.md 159행 이후 섹션 참고.
# - 일부 파일은 생성 스크립트가 grep으로 확인되지 않아 generators: [] + note로 표시함 (표 A "불확실 항목" 참고).
# - 이 파일은 스켈레톤 단계 산출물이며 코드 이관을 수반하지 않음.

