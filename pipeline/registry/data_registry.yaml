# 한계:
# - generators는 파일명 grep 기반으로 읽기/쓰기를 구분하지 않음. 확정판은 W3 업데이트 센터 구현 시 정밀화.
# - operating: true는 표 A에서 앱 참조가 index.html로 확인된 파일 전부 (OPERATING_PATHS.md 고정 목록 +
