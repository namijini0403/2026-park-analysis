module: construction
resource_type: 공사장(착공신고) 행정기록 (학교 주변 참고 맥락)
location:
  file: data_processed/context/facilities_construction.geojson
  lat_key: geometry.coordinates[1]
  lng_key: geometry.coordinates[0]
  name_key: properties.name
external_supply:
  - metric: construction.observed_count
    source: data_processed/context/school_context_summary.json
  - metric: construction.observed_completed_count
    source: data_processed/context/school_context_summary.json
  - metric: located_record_count
    source: data_processed/context/context_layers_manifest.json
internal_supply: 추가 확인 필요
capacity: 추가 확인 필요
target_users: 초등학생 (연수구 소재 학교만 수집 — 그 외 구는 미수집)
operating_hours: 추가 확인 필요
demand_unit: 학생수 (학교 반경 500m 참고 맥락 단위)
constraints:
  - 수집 범위는 연수구 74건뿐이며, 다른 구 학교는 status "unknown" — 0건이 아니라 자료 수집 전
  - 좌표는 상가 주소 기반 추정 위치(74건 중 15건만 좌표 확보)이며 실제 공사 현장 좌표가 아니다
  - 착공신고·사용승인 행정기록이며 현재 공사 진행 여부를 확인한 자료가 아니다
  - 직선거리 500m 기준(도보 경로 아님) — 법정 경계 판단에 사용하지 않는다
policy_actions:
  - access_route_improvement
  - maintain_monitor
reference_date: 2026-09-06  # context_layers_manifest.json data_as_of (산출 기준일; 원자료 2026-03-09 / 2026-06-30)
source:
  - name: 인천광역시 연수구 건축물 착공신고 현황
    provider: 인천광역시 연수구
    license: 추가 확인 필요
    url: "https://www.data.go.kr/data/15029299/fileData.do"
    dataset_id: "15029299"
    source_as_of: 2026-03-09
    uddi: 추가 확인 필요
  - name: 소상공인시장진흥공단 상가(상권)정보 (좌표 추정 기준)
    provider: 소상공인시장진흥공단
    license: 추가 확인 필요
    url: "https://www.data.go.kr/data/15083033/fileData.do"
    dataset_id: "15083033"
    source_as_of: 2026-06-30
    uddi: 추가 확인 필요
notes: 참고 맥락 정보이며 위험도 점수·안전 등급 산정에 반영하지 않는다.
layer:
