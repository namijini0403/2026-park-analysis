  - 명단 미등재는 미지정 확정이 아니라 미상(자료 수집 전)
  - 기간은 학년도만 확인됨(period_basis=school_year_only) — 확정 시작·종료일이 아님
  - 지정 사실만으로 예산·지원금을 추론하지 않는다
policy_actions:
  - institution_link
  - maintain_monitor
