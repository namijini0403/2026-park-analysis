version: 6.48.15
type: DeclarativeSource
check:
  type: CheckStream
  stream_names:
    - datagokr_catalog
definitions:
  base_requester:
    type: HttpRequester
    url_base: https://www.data.go.kr/catalog
streams:
  - type: DeclarativeStream
    name: datagokr_catalog
    primary_key:
      - portal_pk
      - catalog_kind
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        path: "/{{ stream_partition['portal_pk'] }}/{{ config['catalog_kind'] }}.json"
        http_method: GET
        request_headers:
          Accept: application/json
          User-Agent: datarock-airbyte-datagokr-catalog/1.0
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        type: ListPartitionRouter
        cursor_field: portal_pk
        values: "{{ config['portal_pks'] }}"
    transformations:
      - type: AddFields
        fields:
          - path:
              - portal_pk
            value: "{{ stream_partition['portal_pk'] }}"
          - path:
              - catalog_kind
            value: "{{ config['catalog_kind'] }}"
          - path:
              - collected_at
            value: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
      - type: RemoveFields
        field_pointers:
          - - description
          - - "@context"
          - - "@type"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        properties:
          portal_pk:
            type: string
          catalog_kind:
            type: string
          collected_at:
            type: string
            format: date-time
          name:
            type:
              - string
              - "null"
          alternateName:
            type:
              - string
              - "null"
          url:
            type:
              - string
              - "null"
          keywords:
            type:
              - string
              - "null"
          license:
            type:
              - string
              - "null"
          dateCreated:
            type:
              - string
              - "null"
          dateModified:
            type:
              - string
              - "null"
          datePublished:
            type:
              - string
              - "null"
          creator:
            type:
              - object
              - "null"
            additionalProperties: true
          spatialCoverage:
            type:
              - string
              - "null"
          temporalCoverage:
            type:
              - string
              - "null"
          additionalType:
            type:
              - string
              - "null"
          datasetTimeInterval:
            type:
              - string
              - "null"
          encodingFormat:
            type:
              - string
              - "null"
          legislation:
            type:
              - string
              - "null"
spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - portal_pks
    properties:
      portal_pks:
        type: array
        title: 공공데이터포털 데이터셋 번호(pk) 목록
        description: data.go.kr/data/{pk}/... 의 pk. 각 pk 마다 카탈로그 JSON 1건을 수집한다.
        items:
          type: string
        default:
          - "15029299"
          - "15029300"
          - "15038929"
          - "15045018"
          - "15045017"
          - "15013109"
          - "15040972"
          - "15012890"
          - "15021148"
          - "15055212"
        order: 0
      catalog_kind:
        type: string
        title: 카탈로그 종류
        description: 포털 카탈로그 JSON 경로 종류(fileData / standard / openapi)
        enum:
          - fileData
          - standard
          - openapi
        default: fileData
        order: 1
