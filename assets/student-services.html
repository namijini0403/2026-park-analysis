<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 생활서비스 살펴보기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#18372b;font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px}h1{font-size:30px;margin:8px 0}h2{font-size:21px}p{margin:8px 0}a{color:#196b54}header small{letter-spacing:.14em;color:#497063}.card{background:white;border:1px solid #d5e0d8;border-radius:14px;padding:22px;margin:18px 0}.warning{background:#fff5d9;border-left:4px solid #c59825;padding:12px 16px}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:end}label{display:block;font-weight:600}input,select,button{font:inherit;padding:8px;border:1px solid #a5b7ab;border-radius:6px;background:white}input[type=number]{width:80px}button{cursor:pointer;background:#194e3a;color:white}button:disabled{opacity:.45;cursor:default}.scroll{overflow:auto;max-height:510px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e1e7e2;vertical-align:top}th{position:sticky;top:0;background:#eaf1eb;white-space:nowrap}.metrics{display:flex;flex-wrap:wrap;gap:28px}.metrics b{display:block;font-size:25px}.muted{color:#5d7165;font-size:13px}.pill{background:#eaf1eb;padding:3px 8px;border-radius:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}summary{cursor:pointer;font-weight:600}#error{color:#992b21}#map{width:100%;height:350px;background:#eff4ef}svg circle{stroke:white;stroke-width:.7}.selected{background:#eff8ed}button.link{padding:0;border:0;background:none;color:#17664c;text-align:left;text-decoration:underline}.nowrap{white-space:nowrap}@media(max-width:720px){main{padding:14px}.split{grid-template-columns:1fr}h1{font-size:24px}}@media print{button,.controls{display:none}.scroll{max-height:none}main{padding:0}.card{break-inside:avoid}}
</style><style>.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.steps article{background:#f3f7f4;border-radius:12px;padding:18px}.steps h3{margin:0 0 10px;font-size:17px}.status{display:inline-block;background:#fff0cc;color:#6f5014;padding:4px 10px;border-radius:20px}#schools{width:100%;min-width:240px}details{margin-top:16px}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #d58a28;outline-offset:3px}@media(max-width:720px){.steps{grid-template-columns:1fr}.controls label{width:100%}}</style></head><body><main>
<header><small>INCHEON · STUDENT SERVICES</small><h1>우리 학교 주변, 무엇이 확인됐을까요?</h1><p>확인된 자원을 살펴보고, 더 알아볼 조건과 가능한 방법을 함께 봅니다.</p><p><a href="../index.html">전체 지도</a> · <a href="../data_processed/student_services/school_priorities.csv" download>관측 자료 CSV</a> · <button id="export">현재 검토 저장</button></p></header>
<div id="error" role="alert"></div><section class="card"><div class="controls"><label>살펴볼 자원<select id="kind"><option value="sports">자유이용 운동공간</option><option value="library">도서관</option><option value="books">학교 장서</option><option value="welfare">돌봄</option></select></label><label>학교 찾기<input id="search" placeholder="학교 이름 입력"></label><label>학교 선택<select id="schools" aria-label="학교 선택"></select></label></div><p id="school-count" class="muted"></p></section>
<section id="detail" class="card" aria-live="polite"></section>
<section class="card"><h2>확인된 시설 목록</h2><p id="coverage"></p><label>시설 찾기<input id="facility-search" placeholder="시설 이름 또는 주소"></label><div id="facilities" class="scroll"></div></section>
<section class="card"><details><summary>설치 조사 지점과 조건부 비교</summary><p>아직 설치 가능한 부지나 안전한 이동 경로가 확인된 후보가 아닙니다. 조건이 확인된 대안만 비교에 포함됩니다.</p><div class="controls"><label>비교 기준<select id="preference"><option value="">선택하지 않음 — 순위 없음</option><option value="route_m">검증된 보행거리가 짧은 순</option><option value="additional_users">검증된 추가 이용인원이 많은 순</option></select></label><label><input type="checkbox" id="verified-only" checked> 이용·안전·실행·경로가 확인된 대안만</label></div><p id="comparison-note" role="status"></p><div id="candidates" class="scroll"></div></details></section>
<section class="card"><details><summary>자료와 판단 기준 자세히 보기</summary><div id="method"></div></details></section>
</main><script src="student-services.js"></script></body></html>
