    license: 기관별 공개 현황 사실정보·출처 표시, 원문 이용조건은 개별 출처 참조
    update_cycle: 수동 재수집 및 원문 구조 검사
    coverage: 초등돌봄포털 521곳·공유누리 공공 무료 무신청 운동시설 25곳, 사설·예약·등록·조건 미확인 제외, 전수 목록 아님
