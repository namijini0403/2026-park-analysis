  #
  # 이 그룹의 공통 사항
  #   - local_file 은 정규화된 산출물(원자료가 아님)이다. 원자료는 CP949/EPSG:5174 등
  #     변환이 필요해 scripts/build_context_layers.py 가 담당한다.
  #   - rebuild_command 는 승인 반영 직후 실행되어 data_processed/context/ 산출물을
  #     다시 만든다(표준 출력은 감사 로그에 기록된다).
  #   - never_auto_apply: true 는 "사람이 확인 플래그를 줄 때만 반영" 을 뜻한다.
  #     낙인 위험이 있는 시설 레이어와 커버리지가 부분인 레이어에 붙였다.
  # =========================================================================

