  #   - never_auto_apply: true 는 "사람이 확인 플래그를 줄 때만 반영" 을 뜻한다.
  #     낙인 위험이 있는 시설 레이어와 커버리지가 부분인 레이어에 붙였다.
  # =========================================================================

